services:
  nginx-lb:
      image: nginx:alpine
      ports:
        - "8080:80"  # Keep your existing port 8080 for clients
      volumes:
        - ./nginx.conf:/etc/nginx/nginx.conf
      depends_on:
        - api-gateway
      networks:
        - microservices-network
      restart: always

  # API Gateway
  api-gateway:
    build: 
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      - TZ=Europe/Warsaw
    # ports:
    #   - "9876:9876"
    expose:
      - "8080"
      - "9876"
    networks:
      - microservices-network
    depends_on:
      - user-service
      - product-service
      - order-service
    restart: always
    volumes:
      - ./shared:/shared:ro
      - ./shared-logs:/app/logs

  # User Service
  user-service:
    build: 
      context: .
      dockerfile: user-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - TZ=Europe/Warsaw
    networks:
      - microservices-network
    depends_on:
      - user-db
    restart: always
    volumes:
      - ./shared:/shared:ro
      - ./shared-logs:/app/logs

  # User Database (PostgreSQL)
  user-db:
    image: postgres:14-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - TZ=Europe/Warsaw
      - PGTZ=Europe/Warsaw
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    restart: always

  # Product Service
  product-service:
    build:
      context: . 
      dockerfile: product-service/Dockerfile
    ports:
      - "${PORT_PRODUCT}:${PORT_PRODUCT}"
    environment:
      - PORT=${PORT_PRODUCT}
      - MONGO_URI=${MONGO_URI_PRODUCT}
      - JWT_SECRET=${JWT_SECRET}
      - TZ=Europe/Warsaw
    networks:
      - microservices-network
    depends_on:
      - product-db
    restart: always
    volumes:
      - ./shared:/shared:ro
      - ./shared-logs:/app/logs

  # Product Database (MongoDB)
  product-db:
    image: mongo:6-jammy
    ports:
      - "27018:27017"
    environment:
      - TZ=Europe/Warsaw
    volumes:
      - product-db-data:/data/db
    networks:
      - microservices-network
    restart: always

  # Order Service
  order-service:
    build:
      context: .  
      dockerfile: order-service/Dockerfile
    ports:
      - ${PORT_ORDER}:${PORT_ORDER}
    environment:
      - PORT=${PORT_ORDER}
      - MONGO_URI=${MONGO_URI_ORDER}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - microservices-network
    depends_on:
      - order-db
    restart: always
    volumes:
      - ./shared:/shared:ro
      - ./shared-logs:/app/logs
      
  # Order Database (MongoDB)
  order-db:
    image: mongo:6-jammy
    environment:
      - TZ=Europe/Warsaw
    ports:
      - "27017:27017"
    volumes:
      - order-db-data:/data/db
    networks:
      - microservices-network
    restart: always

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:v2.44.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - microservices-network
    restart: always

  # Grafana for visualization
  grafana:
    image: grafana/grafana:9.5.2
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - microservices-network
    depends_on:
      - prometheus
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./elk/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: logstash
    volumes:
      - ./elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./shared-logs:/usr/share/logstash/logs:ro
    ports:
      - "5044:5044"
      - "5001:5000/tcp"
      - "5002:5000/udp"
      - "9600:9600"
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    networks:
      - microservices-network
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    volumes:
      - ./elk/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "5601:5601"
    networks:
      - microservices-network
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  microservices-network:
    driver: bridge

volumes:
  user-db-data:
  product-db-data:
  order-db-data:
  prometheus-data:
  grafana-data:
  elasticsearch_data:
    driver: local