events {
    worker_connections 1024;
}

http {
    # Load balancing configuration
    upstream api_gateway {
        # Round-robin z health checks
        server api-gateway-1:8080 max_fails=3 fail_timeout=30s;
        server api-gateway-2:8080 max_fails=3 fail_timeout=30s;
        server api-gateway-3:8080 max_fails=3 fail_timeout=30s;
        
        # Keep connections alive
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    # Logging for monitoring
    log_format lb_format '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" '
                         'upstream_addr: $upstream_addr '
                         'upstream_status: $upstream_status '
                         'request_time: $request_time '
                         'upstream_response_time: $upstream_response_time '
                         'upstream_connect_time: $upstream_connect_time '
                         'upstream_header_time: $upstream_header_time';

    access_log /var/log/nginx/access.log lb_format;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        
        # Health check for nginx
        location /nginx-health {
            access_log off;
            return 200 "nginx OK\n";
            add_header Content-Type text/plain;
        }

        location /nginx-status {
            stub_status on;
            access_log off;
        }

        location / {
            proxy_pass http://api_gateway;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            # Retry logic
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 20s;
            
            # Health checks
            proxy_intercept_errors on;
        }

        # API Gateway health check endpoint
        location /health {
            proxy_pass http://api_gateway/health;
            access_log off;
        }
    }
}