input {
  file {
    path => "/usr/share/logstash/logs/*.log"
    start_position => "beginning"
    sincedb_path => "/tmp/sincedb"
    codec => "json"
    type => "microservice-log"
  }
}

filter {
  if [type] == "microservice-log" {
    # Parsowanie timestampu
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
    
    # Dodanie pól
    if [service] {
      mutate {
        add_field => { "service_name" => "%{service}" }
      }
    }
    
    if [level] {
      mutate {
        add_field => { "log_level" => "%{level}" }
        uppercase => [ "log_level" ]
      }
    }
    
    # Parsowanie message dla lepszego wyszukiwania
    if [message] {
      mutate {
        add_field => { "log_message" => "%{message}" }
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "microservices-logs-%{+YYYY.MM.dd}"
  }
  
  # Debug output - usuń po sprawdzeniu
  stdout {
    codec => rubydebug
  }
}